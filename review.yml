actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Badgr's own public API is entirely
    request/response REST (the OAuth2-secured v2 API plus the unauthenticated
    Open Badges public-verification JSON endpoints). Change detection is via
    polling *-changed feeds, not a server-push socket, so no AsyncAPI document
    was created - there is no streaming transport on Badgr's own API to model.
