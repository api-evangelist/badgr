        URL configuration (apps/issuer/api_urls.py, apps/backpack/api_urls.py,
        apps/badgeuser/api_urls.py) mounted under /v2 and /o. No endpoints were
        invented beyond what the source and published docs define. The OpenAPI
        document mirrors this exact surface.
