name: Badgr
kind: company
description: Badgr is an open digital badging and micro-credentialing platform built
  on the Open Badges standard. Originally created by Concentric Sky, Badgr is now
  operated by Instructure as Canvas Credentials (and folded into Parchment Digital
  Badges). It lets organizations issue verifiable, portable achievement badges and
  learners collect them in a shareable Backpack. The platform is backed by the
  open-source badgr-server (github.com/concentricsky/badgr-server), which implements
  Open Badges 2.0/2.1 (Badge Connect). The documented REST API (base
  https://api.badgr.io/v2, with regional deployments in the EU, Canada, and
  Australia) uses OAuth2 bearer tokens and exposes Issuers, BadgeClasses,
  Assertions (awarded badges), the learner Backpack, Collections, and Users.
