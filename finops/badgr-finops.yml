meters:
- name: subscription
  description: Institutional subscription to hosted Canvas Credentials / Parchment Digital Badges, quoted by size and volume.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - institution
- name: credential_volume
  description: Number of badges/credentials issued, a driver of hosted subscription tier and quotes.
  unit: badges
  aggregation: sum
  dimensions:
  - account
  - issuer
- name: learners
  description: Number of learners/earners, a driver of hosted subscription pricing.
  unit: users
  aggregation: max
  dimensions:
  - account
- name: self_hosted_compute
  description: Infrastructure cost of running the self-hosted badgr-server (no Badgr invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track issued credential volume and active learners against the subscription tier; on self-hosted, monitor compute, database, and storage costs.
- name: Allocation
  description: Map issuers and badge programs to departments/cost centers so credential spend is attributable.
- name: Optimization
  description: Consolidate issuers, reuse BadgeClasses, and prune stale credentials; self-host the open-source server to trade subscription fees for owned infrastructure when volume justifies it.
- name: Accountability
  description: Assign owners per issuer/program and review credential volume and learner counts against the subscription each renewal.
