description: >-
  FinOps view of Badgr spend. Badgr has two cost profiles. Self-hosting the
  open-source badgr-server (GNU AGPL-3.0) carries no vendor invoice - the cost is
  your own compute, database, storage, and operations for running the service.
  The hosted product - Instructure Canvas Credentials / Parchment Digital Badges,
  formerly Badgr Free/Pro - is billed as an institutional subscription quoted by
  sales, driven by institution size, learner count, credential volume, and
  add-ons, rather than metered per API call. Free hosted issuing was retired at
  the end of 2025, so ongoing issuing generally implies a paid subscription.
notes: >-
  Hosted per-unit rates are not published; verify with Instructure / Parchment
  sales. For self-hosted deployments the dominant costs are infrastructure and
  operations, not a license fee. The API adds no separate charge on either model.
